name: Voilà APK yig'ish

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: "Ilova ochadigan sayt manzili (Salut serveri), masalan https://salut.uz/"
        required: true
        default: "https://voila-fr.up.railway.app/"

permissions:
  contents: write

env:
  RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
  RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
  RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
  RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
  SALUT_ADMOB_APP_ID: ${{ secrets.SALUT_ADMOB_APP_ID }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Salut APK
        id: build
        shell: bash
        env:
          START_URL: ${{ inputs.start_url }}
        run: |
          set -euo pipefail
          props=(-PverCode="${GITHUB_RUN_NUMBER}" -PversionName="1.0.${GITHUB_RUN_NUMBER}" -PstartUrl="${START_URL}" -PadmobAppId="${SALUT_ADMOB_APP_ID:-}")
          release_ready=true
          for value in "$RELEASE_KEYSTORE_BASE64" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD"; do
            [[ -z "$value" ]] && release_ready=false
          done
          if [[ "$release_ready" == true ]]; then
            umask 077
            keystore_file="$RUNNER_TEMP/salut-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
            export RELEASE_KEYSTORE_FILE="$keystore_file"
            gradle --no-daemon --stacktrace --console=plain -p android :app:assembleRelease :app:bundleRelease "${props[@]}"
            cp android/app/build/outputs/apk/release/app-release.apk Salut-release.apk
            cp android/app/build/outputs/bundle/release/app-release.aab Salut-release.aab
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "files=Salut-release.apk Salut-release.aab" >> "$GITHUB_OUTPUT"
          else
            gradle --no-daemon --stacktrace --console=plain -p android :app:assembleDebug "${props[@]}"
            cp android/app/build/outputs/apk/debug/app-debug.apk Salut-debug.apk
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "files=Salut-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Salut-${{ steps.build.outputs.variant }}
          path: |
            Salut-*.apk
            Salut-*.aab
          if-no-files-found: error
